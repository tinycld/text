<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>tinycld text editor</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font: 14px / 1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1a1a1a;
            background: #fff;
        }
        #root { padding: 16px; min-height: 100%; box-sizing: border-box; }
        .hello-world {
            border: 2px dashed #888;
            padding: 16px;
            border-radius: 8px;
            color: #555;
        }
        .hello-world h1 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #1a1a1a;
        }
        .hello-world p { margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="entry.ts"></script>
</body>
</html>
